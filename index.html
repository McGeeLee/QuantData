<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7ef" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("mcgeelee-theme"); } catch { /* Use the system theme when storage is unavailable. */ }
        const theme = saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="description" content="Bilingual market data dashboard, REST API, and MCP server on Cloudflare Workers." />
    <title>QuantData</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
